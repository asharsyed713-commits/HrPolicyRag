
spring.application.name=HrPolicy

# Groq Chat
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b

# Gemini Embeddings
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=3072

# Select providers
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai

# Qdrant configuration
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=hr_policy_collection_v2
spring.ai.vectorstore.qdrant.initialize-schema=true

server.port=8080
